name: CI / CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright E2E Tests'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancels in-progress runs for the same branch if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: 🧹 Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 🧹 Linting (ESLint)
        run: npm run lint

      - name: 🛡️ Typecheck (TypeScript)
        run: npm run typecheck

      - name: 🗄️ Check Supabase DB Types (B-09)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            npm run db:types
            git diff --exit-code src/types/supabase.types.ts || \
              (echo "⚠️  Los tipos TypeScript de Supabase están desactualizados. Ejecuta 'npm run db:types' y haz commit." && exit 1)
          else
            echo "ℹ️  SUPABASE_ACCESS_TOKEN o SUPABASE_PROJECT_ID no configurados — omitiendo verificación de tipos DB."
          fi

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 🧪 Unit Tests (Vitest)
        run: npx vitest run --coverage

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: 📦 Build Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: 📦 Build Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy_anon_key"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_dummy"
          NEXT_PUBLIC_STRIPE_PRICE_ID: "price_dummy"
          NEXT_PUBLIC_STRIPE_PRICE_ID_CLINIC: "price_dummy_clinic"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "dummy_vapid_key"
          NEXT_PUBLIC_IDB_MASTER_KEY: "dummy_idb_key"
          SUPABASE_SERVICE_ROLE_KEY: "dummy"
          STRIPE_SECRET_KEY: "dummy"
          STRIPE_WEBHOOK_SECRET: "dummy"
          GEMINI_API_KEY: "dummy"
          VAPID_PRIVATE_KEY: "dummy"
          VAPID_MAILTO: "dummy"
          ADMIN_EMAIL: "dummy"
          PUSH_SEND_SECRET: "dummy"
          NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
        run: npm run build

      - name: Archive Next.js Build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: 🎭 Playwright E2E Tests
    needs: [build, unit-tests, static-checks]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        
      - name: Install Playwright OS Dependencies
        run: npx playwright install-deps

      - name: 🚀 Start App & Run E2E
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PRICE_ID: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_PRICE_ID_CLINIC: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID_CLINIC }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_IDB_MASTER_KEY: ${{ secrets.NEXT_PUBLIC_IDB_MASTER_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_MAILTO: ${{ secrets.VAPID_MAILTO }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: npm run test:e2e
          
      - name: 📂 Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
